services:
  qdrant:
    image: qdrant/qdrant:v1.19.0
    container_name: facecompare-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/6333"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  insightface:
    image: ghcr.io/deepinsight/insightface-server:0.2.0-cpu
    platform: linux/amd64
    container_name: facecompare-insightface
    init: true
    ports:
      - "8080:8080"
    environment:
      INSIGHTFACE_AUTH_ENABLED: "false"
      INSIGHTFACE_INFERENCE_MODE: onnx
      INSIGHTFACE_EXECUTION_PROVIDER: CPUExecutionProvider
      INSIGHTFACE_WORKERS: "2"
    volumes:
      - ../insightface/server/.models:/models:ro
      - insightface_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  facecompare-api:
    build: .
    container_name: facecompare-api
    ports:
      - "8000:8000"
    environment:
      - INSIGHTFACE_URL=http://insightface:8080
      - QDRANT_URL=http://qdrant:6333
      - DEFAULT_MATCH_THRESHOLD=0.60
    depends_on:
      qdrant:
        condition: service_healthy
      insightface:
        condition: service_healthy

volumes:
  qdrant_data:
  insightface_data:
