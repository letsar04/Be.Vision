<!doctype html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Be.Vision Control Center</title>
<style>body{font-family:system-ui;margin:0;background:#0b0f14;color:#e9eef5}header{padding:18px 24px;border-bottom:1px solid #26303a}main{padding:20px;max-width:1200px;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}.card{background:#151b22;border:1px solid #27323d;border-radius:14px;padding:14px}.feed{width:100%;aspect-ratio:16/9;object-fit:cover;background:#000;border-radius:10px}.online{color:#71e39a}.offline{color:#ff8c8c}button,input,select{padding:10px;border-radius:8px;border:1px solid #394552;background:#111820;color:#fff}button{cursor:pointer}</style></head>
<body><header><strong>Be.Vision Control Center</strong> <span id="summary"></span></header><main><div style="margin-bottom:18px"><input id="name" placeholder="Nom caméra"><select id="type"><option value="phone">Téléphone</option><option value="rtsp">RTSP/IP</option><option value="webcam">Webcam USB</option></select><input id="uri" placeholder="rtsp://… (RTSP seulement)"><button onclick="add()">Ajouter</button></div><div id="grid" class="grid"></div></main>
<script>
let cameras=[];
async function load(){const r=await fetch("/api/v1/cameras?tenant_id=default");cameras=await r.json();render();cameras.forEach(c=>{if(c.source_type==="rtsp"&&!c.running)start(c)})}
function render(){document.getElementById("summary").textContent=cameras.length+" caméra(s)";const g=document.getElementById("grid");g.innerHTML=cameras.map(c=>'<div class="card"><h3>'+c.name+'</h3><p>'+c.source_type+' — <span id="s-'+c.id+'">…</span></p><img class="feed" src="/api/v1/cameras/'+c.id+'/stream"><p id="e-'+c.id+'">Aucun événement</p><button onclick="openPhone(\''+c.id+'\')">Ouvrir sur téléphone</button></div>').join("");cameras.forEach(poll)}
async function poll(c){try{const s=await(await fetch("/api/v1/cameras/"+c.id+"/status")).json(),el=document.getElementById("s-"+c.id);if(el){el.className=s.online?"online":"offline";el.textContent=s.online?"EN LIGNE":"HORS LIGNE"}if(s.last_event&&s.last_event.event)document.getElementById("e-"+c.id).textContent=s.last_event.event.type+" "+(s.last_event.event.confidence?Number(s.last_event.event.confidence).toFixed(2):"")}catch{}}
async function add(){const body={name:document.getElementById("name").value||"Camera",source_type:document.getElementById("type").value,source_uri:document.getElementById("uri").value||null,tenant_id:"default"};await fetch("/api/v1/cameras",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});document.getElementById("name").value="";load()}
async function start(c){await fetch("/api/v1/cameras/"+c.id+"/start",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({tenant_id:"default"})})}
function openPhone(id){window.open("/camera/phone?camera_id="+encodeURIComponent(id)+"&tenant_id=default","_blank")}
load();setInterval(load,5000);
</script></body></html>
